goodToKnow:
  - en: "Runs from April to October only: in winter the high passes (Aguelzim, Tizi n’Ouanoums) are under snow and closed."
    fr: "Uniquement d’avril à octobre : en hiver, les cols (Aguelzim, Tizi n’Ouanoums) sont enneigés et fermés."
    es: "Solo de abril a octubre: en invierno los collados (Aguelzim, Tizi n’Ouanoums) están nevados y cerrados."
    de: "Nur von April bis Oktober: Im Winter sind die Pässe (Aguelzim, Tizi n’Ouanoums) verschneit und gesperrt."
    pt: "Só de abril a outubro: no inverno os colos (Aguelzim, Tizi n’Ouanoums) estão cobertos de neve e fechados."
    ar: "من أبريل إلى أكتوبر فقط: في الشتاء تكون الممرات (أكلزيم، تيزي ن وانومس) مغطاة بالثلج ومغلقة."
  - en: "All inclusive: return transport, nights in gîtes, refuges and bivouac, breakfasts, lunches, dinners and professional guides."
    fr: "Tout compris : transport aller-retour, nuits en gîtes, refuges et bivouac, petits-déjeuners, déjeuners, dîners et guides professionnels."
    es: "Todo incluido: transporte de ida y vuelta, noches en albergues, refugios y vivac, desayunos, almuerzos, cenas y guías profesionales."
    de: "Alles inklusive: Hin- und Rückfahrt, Übernachtungen in Herbergen, Hütten und Biwak, Frühstück, Mittag- und Abendessen sowie professionelle Guides."
    pt: "Tudo incluído: transporte de ida e volta, noites em gîtes, refúgios e bivaque, pequenos-almoços, almoços, jantares e guias profissionais."
    ar: "كل شيء مشمول: النقل ذهابا وإيابا، والمبيت في المآوي والملاجئ والمخيم، والفطور والغداء والعشاء، ومرشدون محترفون."
  - en: Six walking days, two of them above 3,500 m. You need very good fitness and some experience of long mountain days.
    fr: Six jours de marche, dont deux au-dessus de 3 500 m. Il faut une très bonne condition physique et l’habitude des longues journées en montagne.
    es: Seis días de marcha, dos de ellos por encima de 3500 m. Se necesita muy buena forma física y algo de experiencia en jornadas largas de montaña.
    de: Sechs Wandertage, davon zwei über 3.500 m. Sie brauchen sehr gute Kondition und Erfahrung mit langen Bergtagen.
    pt: Seis dias de caminhada, dois deles acima dos 3500 m. É precisa muito boa forma física e alguma experiência de dias longos na montanha.
    ar: ستة أيام من المشي، منها يومان فوق 3500 م. تحتاجون إلى لياقة عالية جدا وبعض الخبرة في الأيام الجبلية الطويلة.
  - en: Weather decides. If the guide judges a pass or the summit unsafe, you turn back or change the route. Your safety comes first.
    fr: La météo décide. Si le guide juge un col ou le sommet dangereux, on fait demi-tour ou on change d’itinéraire. Votre sécurité passe avant tout.
    es: Manda el tiempo. Si el guía considera que un collado o la cumbre no son seguros, se da la vuelta o se cambia de ruta. Su seguridad es lo primero.
    de: Das Wetter entscheidet. Hält der Guide einen Pass oder den Gipfel für unsicher, kehren Sie um oder ändern die Route. Ihre Sicherheit geht vor.
    pt: Quem decide é o tempo. Se o guia considerar um colo ou o cume inseguro, volta-se para trás ou muda-se de rota. A sua segurança está em primeiro lugar.
    ar: الطقس هو الذي يقرر. إذا رأى المرشد أن ممرا أو القمة غير آمنين، نعود أو نغير المسار. سلامتكم أولا.
