      pt: Partida com lanterna frontal, vista panorâmica do ponto dos 4000 m ao amanhecer e cume por volta das 8h a ritmo médio. Regresso ao refúgio para almoçar e uma tarde tranquila.
      ar: الانطلاق بمصابيح الرأس، وإطلالة بانورامية من نقطة 4000 م عند الفجر، والوصول إلى القمة حوالي الثامنة بوتيرة متوسطة. العودة إلى الملجأ للغداء وفترة بعد الظهر هادئة.
