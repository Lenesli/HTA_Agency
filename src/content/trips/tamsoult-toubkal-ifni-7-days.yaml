    text:
      en: Morning drive to Imi Oughlad and start walking towards the Azzaden valley. Lunch at Tizi n’Igrar, then on to Tizi Oussem for dinner and the night in a gîte.
      fr: Route matinale vers Imi Oughlad et départ à pied vers la vallée d’Azzaden. Déjeuner à Tizi n’Igrar, puis suite jusqu’à Tizi Oussem pour le dîner et la nuit en gîte d’étape.
      es: Carretera por la mañana hasta Imi Oughlad y salida a pie hacia el valle de Azzaden. Almuerzo en Tizi n’Igrar y continuación hasta Tizi Oussem para cenar y dormir en un albergue.
      de: Morgens Fahrt nach Imi Oughlad und Start der Wanderung ins Azzaden-Tal. Mittagessen am Tizi n’Igrar, dann weiter nach Tizi Oussem zu Abendessen und Übernachtung in einer Herberge.
      pt: Estrada de manhã até Imi Oughlad e início da caminhada para o vale de Azzaden. Almoço em Tizi n’Igrar e continuação até Tizi Oussem para jantar e dormir num gîte.
      ar: الانطلاق صباحا نحو إمي أوغلاد وبداية المشي نحو وادي أزادن. الغداء في تيزي ن إكرار، ثم المواصلة إلى تيزي أوسم للعشاء والمبيت في مأوى.
