  - title: { en: "Lake Ifni to Amsouzart", fr: "Du lac d’Ifni à Amsouzart", es: "Del lago Ifni a Amsouzart", de: "Vom Ifni-See nach Amsouzart", pt: "Do lago Ifni a Amsouzart", ar: "من بحيرة إفني إلى أمسوزارت" }
    text:
      en: Walk down to Amsouzart with a tea break at Da Blaid’s house. Lunch at the local gîte, an afternoon walk to the Amsouzart viewpoint, a snack, dinner and a last evening together.
      fr: Descente vers Amsouzart avec une pause thé chez Da Blaid. Déjeuner au gîte local, balade l’après-midi jusqu’au point de vue d’Amsouzart, goûter, dîner et dernière soirée ensemble.
      es: Bajada a Amsouzart con pausa para el té en casa de Da Blaid. Almuerzo en el albergue local, paseo por la tarde hasta el mirador de Amsouzart, merienda, cena y última velada juntos.
      de: Abstieg nach Amsouzart mit Teepause bei Da Blaid. Mittagessen in der Dorfherberge, nachmittags Spaziergang zum Aussichtspunkt von Amsouzart, Imbiss, Abendessen und ein letzter gemeinsamer Abend.
      pt: Descida a Amsouzart com pausa para chá em casa de Da Blaid. Almoço no gîte local, passeio à tarde até ao miradouro de Amsouzart, lanche, jantar e uma última noite juntos.
      ar: النزول إلى أمسوزارت مع استراحة شاي عند دا بلعيد. الغداء في المأوى المحلي، وجولة بعد الظهر إلى المطل البانورامي لأمسوزارت، ثم وجبة خفيفة والعشاء وأمسية أخيرة معا.
