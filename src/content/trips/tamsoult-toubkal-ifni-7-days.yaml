  - title: { en: "Tizi n’Ouanoums and Lake Ifni", fr: "Tizi n’Ouanoums et le lac d’Ifni", es: "Tizi n’Ouanoums y el lago Ifni", de: "Tizi n’Ouanoums und der Ifni-See", pt: "Tizi n’Ouanoums e o lago Ifni", ar: "تيزي ن وانومس وبحيرة إفني" }
    text:
      en: Over the Tizi n’Ouanoums pass, with time for photos and a rest, and down to Lake Ifni. Afternoon free to swim and relax, dinner and night at the lakeside bivouac.
      fr: Passage du col de Tizi n’Ouanoums, avec du temps pour les photos et le repos, puis descente au lac d’Ifni. Après-midi libre pour nager et se détendre, dîner et nuit au bivouac du lac.
      es: Paso por el collado de Tizi n’Ouanoums, con tiempo para fotos y descanso, y bajada al lago Ifni. Tarde libre para nadar y relajarse, cena y noche en el vivac junto al lago.
      de: Über den Pass Tizi n’Ouanoums, mit Zeit für Fotos und eine Pause, hinunter zum Ifni-See. Nachmittag frei zum Schwimmen und Entspannen, Abendessen und Nacht im Biwak am See.
      pt: Passagem pelo colo de Tizi n’Ouanoums, com tempo para fotos e descanso, e descida ao lago Ifni. Tarde livre para nadar e relaxar, jantar e noite no bivaque junto ao lago.
      ar: عبور ممر تيزي ن وانومس مع وقت للصور والراحة، ثم النزول إلى بحيرة إفني. فترة بعد الظهر حرة للسباحة والاسترخاء، والعشاء والمبيت في المخيم بجانب البحيرة.
