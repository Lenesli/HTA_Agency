title:
  en: Toubkal grand trek via Tamsoult and Lake Ifni, 7 days
  fr: Grand trek du Toubkal par Tamsoult et le lac d’Ifni, 7 jours
  es: Gran trek del Toubkal por Tamsoult y el lago Ifni, 7 días
  de: Große Toubkal-Tour über Tamsoult und den Ifni-See, 7 Tage
  pt: Grande trekking do Toubkal por Tamsoult e o lago Ifni, 7 dias
  ar: الرحلة الكبرى لتوبقال عبر تامسولت وبحيرة إفني في 7 أيام
summary:
  en: A full crossing of the Toubkal massif, from April to October. Azzaden, the Ighouliden waterfall, the Toubkal summit (4,167 m), Lake Ifni and Amsouzart. All inclusive.
  fr: Une traversée complète du massif du Toubkal, d’avril à octobre. Azzaden, la cascade d’Ighouliden, le sommet du Toubkal (4 167 m), le lac d’Ifni et Amsouzart. Tout compris.
  es: Una travesía completa del macizo del Toubkal, de abril a octubre. Azzaden, la cascada de Ighouliden, la cumbre del Toubkal (4167 m), el lago Ifni y Amsouzart. Todo incluido.
  de: Eine komplette Durchquerung des Toubkal-Massivs, von April bis Oktober. Azzaden, Ighouliden-Wasserfall, Toubkal-Gipfel (4.167 m), Ifni-See und Amsouzart. Alles inklusive.
  pt: Uma travessia completa do maciço do Toubkal, de abril a outubro. Azzaden, a cascata de Ighouliden, o cume do Toubkal (4167 m), o lago Ifni e Amsouzart. Tudo incluído.
  ar: عبور كامل لجبال توبقال، من أبريل إلى أكتوبر. أزادن، شلال إغوليدن، قمة توبقال (4167 م)، بحيرة إفني وأمسوزارت. كل شيء مشمول.
about:
  en: >-
    Our longest trek, and the best way to know the High Atlas. You start at Imi Oughlad and walk up the Azzaden valley to Tizi Oussem, then on to the Ighouliden waterfall and the Tamsoult area, with an afternoon to acclimatise. Day three crosses Aguelzim to the Toubkal refuge. On day four you climb Toubkal (4,167 m) by head torch and reach the summit around 8 am. Then the route goes south over Tizi n’Ouanoums to Lake Ifni for a night at the lakeside bivouac, and down to the village of Amsouzart before the drive back to Marrakech. Because the high passes are under snow in winter, this trek runs from April only.
  fr: >-
    Notre trek le plus long, et la meilleure façon de connaître le Haut Atlas. Départ d’Imi Oughlad et montée par la vallée d’Azzaden jusqu’à Tizi Oussem, puis la cascade d’Ighouliden et le secteur de Tamsoult, avec un après-midi d’acclimatation. Le troisième jour, passage par Aguelzim jusqu’au refuge du Toubkal. Le quatrième jour, ascension du Toubkal (4 167 m) à la frontale, avec le sommet vers 8 h. L’itinéraire part ensuite vers le sud par Tizi n’Ouanoums jusqu’au lac d’Ifni pour une nuit en bivouac au bord de l’eau, puis descend au village d’Amsouzart avant le retour à Marrakech. Comme les cols sont enneigés en hiver, ce trek se fait uniquement à partir d’avril.
  es: "Nuestro trek más largo y la mejor forma de conocer el Alto Atlas. Se sale de Imi Oughlad y se sube por el valle de Azzaden hasta Tizi Oussem, después a la cascada de Ighouliden y la zona de Tamsoult, con una tarde para aclimatarse. El tercer día se cruza Aguelzim hasta el refugio del Toubkal. El cuarto día se sube al Toubkal (4167 m) con linterna frontal y se llega a la cumbre hacia las 8. Después la ruta va hacia el sur por Tizi n’Ouanoums hasta el lago Ifni para una noche de vivac junto al agua, y baja al pueblo de Amsouzart antes de volver a Marrakech. Como los collados están nevados en invierno, este trek solo se hace a partir de abril."
  de: "Unser längster Trek und die beste Art, den Hohen Atlas kennenzulernen. Start in Imi Oughlad, Aufstieg durch das Azzaden-Tal nach Tizi Oussem, dann weiter zum Ighouliden-Wasserfall und ins Gebiet von Tamsoult, mit einem Nachmittag zur Akklimatisierung. Am dritten Tag geht es über Aguelzim zur Toubkal-Hütte. Am vierten Tag besteigen Sie mit Stirnlampe den Toubkal (4.167 m) und stehen gegen 8 Uhr auf dem Gipfel. Danach führt die Route nach Süden über den Tizi n’Ouanoums zum Ifni-See mit einer Nacht im Biwak am Ufer und hinunter ins Dorf Amsouzart, bevor es zurück nach Marrakesch geht. Da die Pässe im Winter verschneit sind, gibt es diesen Trek erst ab April."
  pt: "O nosso trekking mais longo e a melhor forma de conhecer o Alto Atlas. Parte-se de Imi Oughlad e sobe-se o vale de Azzaden até Tizi Oussem, depois até à cascata de Ighouliden e à zona de Tamsoult, com uma tarde para aclimatar. No terceiro dia atravessa-se Aguelzim até ao refúgio do Toubkal. No quarto dia sobe-se o Toubkal (4167 m) com lanterna frontal e chega-se ao cume por volta das 8h. Depois a rota segue para sul por Tizi n’Ouanoums até ao lago Ifni para uma noite de bivaque junto à água, e desce à aldeia de Amsouzart antes do regresso a Marraquexe. Como os colos estão cobertos de neve no inverno, este trekking só se faz a partir de abril."
  ar: >-
    أطول رحلاتنا وأفضل طريقة للتعرف على الأطلس الكبير. الانطلاق من إمي أوغلاد والصعود عبر وادي أزادن إلى تيزي أوسم، ثم إلى شلال إغوليدن ومنطقة تامسولت مع فترة بعد الظهر للتأقلم. في اليوم الثالث العبور عبر أكلزيم إلى ملجأ توبقال. في اليوم الرابع صعود توبقال (4167 م) بمصابيح الرأس والوصول إلى القمة حوالي الثامنة. بعد ذلك يتجه المسار جنوبا عبر تيزي ن وانومس إلى بحيرة إفني لقضاء ليلة في مخيم على ضفتها، ثم النزول إلى قرية أمسوزارت قبل العودة إلى مراكش. بما أن الممرات مغطاة بالثلج في الشتاء، تُنظَّم هذه الرحلة ابتداء من أبريل فقط.
