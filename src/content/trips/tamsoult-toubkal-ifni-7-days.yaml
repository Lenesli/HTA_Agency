    text:
      en: Breakfast and the drive back to Marrakech, with lunch in Aït Ourir on the way.
      fr: Petit-déjeuner et route vers Marrakech, avec déjeuner à Aït Ourir en chemin.
      es: Desayuno y regreso a Marrakech, con almuerzo en Aït Ourir por el camino.
      de: Frühstück und Rückfahrt nach Marrakesch, mit Mittagessen in Aït Ourir unterwegs.
      pt: Pequeno-almoço e regresso a Marraquexe, com almoço em Aït Ourir pelo caminho.
      ar: الفطور ثم الطريق إلى مراكش، مع الغداء في آيت أورير.
