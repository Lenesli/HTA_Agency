    text:
      en: A start by head torch, a panoramic view from the 4,000 m point at dawn and the summit around 8 am at an average pace. Back at the refuge for lunch and a quiet afternoon.
      fr: Départ à la frontale, vue panoramique depuis la pointe des 4 000 m à l’aube et sommet vers 8 h à rythme moyen. Retour au refuge pour le déjeuner et un après-midi de repos.
      es: Salida con linterna frontal, vista panorámica desde el punto de 4000 m al amanecer y cumbre hacia las 8 a ritmo medio. Vuelta al refugio para almorzar y una tarde tranquila.
