goodToKnow:
  - en: "The trip includes return transport, 2 nights (one in a local gîte, one at the Lake Ifni bivouac) and all meals."
    fr: "Le séjour comprend le transport aller-retour, 2 nuits (une en gîte local, une au bivouac du lac d’Ifni) et tous les repas."
    es: "El viaje incluye el transporte de ida y vuelta, 2 noches (una en un albergue local y otra en el vivac del lago Ifni) y todas las comidas."
    de: "Enthalten sind Hin- und Rückfahrt, 2 Nächte (eine in einer örtlichen Herberge, eine im Biwak am Ifni-See) und alle Mahlzeiten."
    pt: "A viagem inclui o transporte de ida e volta, 2 noites (uma num gîte local e outra no bivaque do lago Ifni) e todas as refeições."
    ar: "تشمل الرحلة النقل ذهابا وإيابا، وليلتين (واحدة في مأوى محلي والأخرى في مخيم بحيرة إفني)، وكل الوجبات."
  - en: The lake is at about 2,300 m. Nights are cool even in summer, so bring a warm layer.
    fr: "Le lac est à environ 2 300 m. Les nuits sont fraîches même en été : prévoyez une couche chaude."
    es: "El lago está a unos 2300 m. Las noches son frescas incluso en verano: lleve una capa de abrigo."
    de: Der See liegt auf etwa 2.300 m. Die Nächte sind auch im Sommer kühl, nehmen Sie eine warme Schicht mit.
    pt: "O lago fica a cerca de 2300 m. As noites são frescas mesmo no verão: leve uma camada quente."
    ar: تقع البحيرة على ارتفاع حوالي 2300 م. الليالي باردة حتى في الصيف، لذا أحضروا ملابس دافئة.
