summary:
  en: The south side of the Toubkal massif. A night in a village gîte at Amsouzart, then a whole day and a night by the turquoise water of Lake Ifni.
  fr: Le versant sud du massif du Toubkal. Une nuit dans un gîte de village à Amsouzart, puis une journée et une nuit au bord des eaux turquoise du lac d’Ifni.
  es: La vertiente sur del macizo del Toubkal. Una noche en un albergue del pueblo de Amsouzart y después un día y una noche junto a las aguas turquesas del lago Ifni.
  de: Die Südseite des Toubkal-Massivs. Eine Nacht in einer Dorfherberge in Amsouzart, dann ein ganzer Tag und eine Nacht am türkisfarbenen Ifni-See.
  pt: A vertente sul do maciço do Toubkal. Uma noite num gîte da aldeia de Amsouzart e depois um dia e uma noite junto às águas turquesa do lago Ifni.
  ar: الجهة الجنوبية لجبال توبقال. ليلة في مأوى قروي بأمسوزارت، ثم يوم كامل وليلة على ضفاف مياه بحيرة إفني الفيروزية.
about:
  en: >-
    An easy-going mountain trip for those who want the Atlas without a big climb. You drive from Marrakech, stop for lunch at Tadart and reach Amsouzart in the evening for dinner and a night in a local gîte. Next morning a two-hour walk takes you to Lake Ifni, the only natural high lake of the Toubkal massif: the rest of the day is free to rest, swim and explore, and you sleep at the bivouac by the lake. On day three you walk back to Amsouzart, stop for mint tea in a traditional house and drive back to Marrakech, with lunch at Tadart on the way.
  fr: >-
    Un séjour en montagne tranquille pour qui veut l’Atlas sans grosse ascension. Route depuis Marrakech, déjeuner à Tadart et arrivée à Amsouzart le soir pour le dîner et une nuit en gîte local. Le lendemain, deux heures de marche mènent au lac d’Ifni, le seul lac naturel d’altitude du massif du Toubkal : le reste de la journée est libre pour se reposer, nager et se balader, et la nuit se passe au bivouac au bord du lac. Le troisième jour, retour à pied à Amsouzart, pause thé dans une maison traditionnelle et route vers Marrakech, avec déjeuner à Tadart.
  es: "Una escapada tranquila a la montaña para quien quiere el Atlas sin una gran subida. Se viaja desde Marrakech, se almuerza en Tadart y se llega a Amsouzart por la tarde para cenar y dormir en un albergue local. A la mañana siguiente, dos horas de caminata llevan al lago Ifni, el único lago natural de altura del macizo del Toubkal: el resto del día es libre para descansar, nadar y pasear, y se duerme en el vivac junto al lago. El tercer día se vuelve a pie a Amsouzart, se toma un té en una casa tradicional y se regresa a Marrakech, con almuerzo en Tadart."
  de: "Eine entspannte Bergreise für alle, die den Atlas ohne großen Aufstieg erleben möchten. Fahrt ab Marrakesch, Mittagessen in Tadart und abends Ankunft in Amsouzart, Abendessen und Nacht in einer örtlichen Herberge. Am nächsten Morgen führen zwei Stunden Gehzeit zum Ifni-See, dem einzigen natürlichen Hochsee des Toubkal-Massivs: Der Rest des Tages ist frei zum Ausruhen, Schwimmen und Erkunden, und Sie übernachten im Biwak am See. Am dritten Tag geht es zu Fuß zurück nach Amsouzart, mit Minztee in einem traditionellen Haus, und dann nach Marrakesch, mit Mittagessen in Tadart."
  pt: "Uma viagem tranquila à montanha para quem quer o Atlas sem uma grande subida. Viaja-se desde Marraquexe, almoça-se em Tadart e chega-se a Amsouzart ao fim do dia para jantar e dormir num gîte local. Na manhã seguinte, duas horas de caminhada levam ao lago Ifni, o único lago natural de altitude do maciço do Toubkal: o resto do dia é livre para descansar, nadar e passear, e dorme-se no bivaque junto ao lago. No terceiro dia regressa-se a pé a Amsouzart, com chá numa casa tradicional, e depois a Marraquexe, com almoço em Tadart."
  ar: >-
    رحلة جبلية هادئة لمن يريد الأطلس بدون صعود كبير. الانطلاق من مراكش، والغداء في تادارت، ثم الوصول إلى أمسوزارت مساءً للعشاء والمبيت في مأوى محلي. في الصباح الموالي، ساعتان من المشي تقودانكم إلى بحيرة إفني، البحيرة الطبيعية الوحيدة في أعالي جبال توبقال: بقية اليوم حرة للراحة والسباحة والتجول، والمبيت في المخيم بجانب البحيرة. في اليوم الثالث تعودون مشيا إلى أمسوزارت، مع استراحة شاي في بيت تقليدي، ثم الطريق إلى مراكش مع الغداء في تادارت.
