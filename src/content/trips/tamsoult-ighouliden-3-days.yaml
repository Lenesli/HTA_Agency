summary:
  en: A loop west of Imlil over Tizi Mzik to the Tamsoult refuge, a morning at the Ighouliden waterfall and the way back through the village of Id Issa.
  fr: Une boucle à l’ouest d’Imlil par Tizi Mzik jusqu’au refuge de Tamsoult, une matinée à la cascade d’Ighouliden et le retour par le village d’Id Issa.
  es: Un circuito al oeste de Imlil por Tizi Mzik hasta el refugio de Tamsoult, una mañana en la cascada de Ighouliden y la vuelta por el pueblo de Id Issa.
  de: Eine Runde westlich von Imlil über den Tizi Mzik zur Tamsoult-Hütte, ein Morgen am Ighouliden-Wasserfall und der Rückweg durch das Dorf Id Issa.
  pt: Um circuito a oeste de Imlil por Tizi Mzik até ao refúgio de Tamsoult, uma manhã na cascata de Ighouliden e o regresso pela aldeia de Id Issa.
  ar: جولة غرب إمليل عبر تيزي مزيك إلى ملجأ تامسولت، وصباح عند شلال إغوليدن، ثم العودة عبر قرية إد عيسى.
about:
  en: >-
    A green, less busy side of the Toubkal National Park, with no summit to rush for. After a night at a hotel in Imlil, you cross the Tizi Mzik pass, stop there for lunch and walk down to the Tamsoult refuge for the night. The next morning you reach the Ighouliden waterfall, one of the highest in the High Atlas, then return to Imlil by the Id Issa path, with a break in a village guesthouse on the way. Lunch at the hotel and transport back to Marrakech in the evening.
  fr: >-
    Un côté verdoyant et moins fréquenté du parc national du Toubkal, sans sommet à atteindre. Après une nuit à l’hôtel à Imlil, vous passez le col de Tizi Mzik, y déjeunez et descendez au refuge de Tamsoult pour la nuit. Le lendemain matin, vous rejoignez la cascade d’Ighouliden, l’une des plus hautes du Haut Atlas, puis rentrez à Imlil par le chemin d’Id Issa, avec une pause dans une maison d’hôtes du village. Déjeuner à l’hôtel et transport vers Marrakech en soirée.
  es: "Un lado verde y menos concurrido del parque nacional del Toubkal, sin cumbre que alcanzar. Tras una noche en un hotel de Imlil, se cruza el collado de Tizi Mzik, se almuerza allí y se baja al refugio de Tamsoult para dormir. A la mañana siguiente se llega a la cascada de Ighouliden, una de las más altas del Alto Atlas, y se vuelve a Imlil por el camino de Id Issa, con una pausa en una casa de huéspedes del pueblo. Almuerzo en el hotel y transporte a Marrakech por la tarde."
  de: "Eine grüne, ruhigere Seite des Toubkal-Nationalparks, ohne Gipfeldruck. Nach einer Nacht im Hotel in Imlil überqueren Sie den Tizi Mzik, essen dort zu Mittag und steigen zur Tamsoult-Hütte ab. Am nächsten Morgen erreichen Sie den Ighouliden-Wasserfall, einen der höchsten im Hohen Atlas, und kehren über den Weg von Id Issa nach Imlil zurück, mit einer Pause in einem Gästehaus im Dorf. Mittagessen im Hotel und abends Rückfahrt nach Marrakesch."
  pt: "Um lado verde e menos movimentado do parque nacional do Toubkal, sem cume para alcançar. Depois de uma noite num hotel em Imlil, atravessa o colo de Tizi Mzik, almoça lá e desce ao refúgio de Tamsoult para dormir. Na manhã seguinte chega à cascata de Ighouliden, uma das mais altas do Alto Atlas, e regressa a Imlil pelo caminho de Id Issa, com uma pausa numa casa de hóspedes da aldeia. Almoço no hotel e transporte para Marraquexe ao fim do dia."
  ar: >-
    جانب أخضر وأقل ازدحاما من المنتزه الوطني لتوبقال، بدون قمة. بعد ليلة في فندق بإمليل، تعبرون ممر تيزي مزيك وتتناولون الغداء هناك، ثم تنزلون إلى ملجأ تامسولت للمبيت. في الصباح الموالي تصلون إلى شلال إغوليدن، أحد أعلى الشلالات في الأطلس الكبير، ثم تعودون إلى إمليل عبر طريق إد عيسى مع استراحة في دار ضيافة بالقرية. الغداء في الفندق والنقل إلى مراكش مساءً.
