summary:
  en: From Imlil over the Tamatert pass to Tacheddirt, the highest village in North Africa, then a sunrise climb to the summit of Inghmer (3,891 m).
  fr: D’Imlil au col de Tamatert puis à Tacheddirt, le plus haut village d’Afrique du Nord, avant une ascension à l’aube jusqu’au sommet de l’Inghmer (3 891 m).
  es: De Imlil por el collado de Tamatert hasta Tacheddirt, el pueblo más alto del norte de África, y subida al amanecer a la cumbre del Inghmer (3891 m).
  de: Von Imlil über den Tamatert-Pass nach Tacheddirt, dem höchsten Dorf Nordafrikas, dann im Morgengrauen auf den Gipfel des Inghmer (3.891 m).
  pt: De Imlil pelo colo de Tamatert até Tacheddirt, a aldeia mais alta do Norte de África, e subida ao amanhecer ao cume do Inghmer (3891 m).
  ar: من إمليل عبر ممر تامترت إلى تاشديرت، أعلى قرية في شمال إفريقيا، ثم الصعود فجرا إلى قمة إنغمر (3891 م).
about:
  en: >-
    A quieter alternative to Toubkal, east of Imlil. You sleep the first night in Imlil, then walk over Tizi n’Tamatert and past the Khadija waterfall to the gîte in Ogoug, below Tacheddirt, the highest village in North Africa. The afternoon is free to rest or visit the village. On day three you leave at 3:30 am by head torch, cross Tizi n’Tacheddirt (3,650 m) and reach the summit of Inghmer (3,891 m) around 8 am, with a view over the whole Toubkal massif. Back at the gîte for lunch, then the drive to Marrakech.
  fr: >-
    Une alternative plus calme au Toubkal, à l’est d’Imlil. Première nuit à Imlil, puis marche par Tizi n’Tamatert et la cascade Khadija jusqu’au gîte d’Ogoug, sous Tacheddirt, le plus haut village d’Afrique du Nord. L’après-midi est libre pour se reposer ou visiter le village. Le troisième jour, départ à 3 h 30 à la frontale, passage de Tizi n’Tacheddirt (3 650 m) et arrivée au sommet de l’Inghmer (3 891 m) vers 8 h, avec vue sur tout le massif du Toubkal. Retour au gîte pour le déjeuner, puis route vers Marrakech.
  es: "Una alternativa más tranquila al Toubkal, al este de Imlil. La primera noche se duerme en Imlil; después se camina por Tizi n’Tamatert y la cascada Khadija hasta el albergue de Ogoug, bajo Tacheddirt, el pueblo más alto del norte de África. La tarde es libre para descansar o visitar el pueblo. El tercer día se sale a las 3:30 con linterna frontal, se cruza Tizi n’Tacheddirt (3650 m) y se llega a la cumbre del Inghmer (3891 m) hacia las 8, con vistas a todo el macizo del Toubkal. Vuelta al albergue para almorzar y regreso a Marrakech."
  de: "Eine ruhigere Alternative zum Toubkal, östlich von Imlil. Die erste Nacht verbringen Sie in Imlil, dann geht es über den Tizi n’Tamatert und am Khadija-Wasserfall vorbei zur Herberge in Ogoug unterhalb von Tacheddirt, dem höchsten Dorf Nordafrikas. Der Nachmittag ist frei zum Ausruhen oder für einen Dorfrundgang. Am dritten Tag starten Sie um 3:30 Uhr mit Stirnlampe, überqueren den Tizi n’Tacheddirt (3.650 m) und stehen gegen 8 Uhr auf dem Gipfel des Inghmer (3.891 m), mit Blick über das ganze Toubkal-Massiv. Mittagessen in der Herberge, dann Rückfahrt nach Marrakesch."
  pt: "Uma alternativa mais tranquila ao Toubkal, a leste de Imlil. A primeira noite é em Imlil; depois caminha-se por Tizi n’Tamatert e pela cascata Khadija até ao gîte de Ogoug, abaixo de Tacheddirt, a aldeia mais alta do Norte de África. A tarde é livre para descansar ou visitar a aldeia. No terceiro dia parte às 3h30 com lanterna frontal, atravessa Tizi n’Tacheddirt (3650 m) e chega ao cume do Inghmer (3891 m) por volta das 8h, com vista sobre todo o maciço do Toubkal. Regresso ao gîte para almoçar e depois a viagem até Marraquexe."
  ar: >-
    بديل أكثر هدوءا لتوبقال، شرق إمليل. تبيتون الليلة الأولى في إمليل، ثم تمشون عبر تيزي ن تامترت مرورا بشلال خديجة حتى مأوى أوغوغ أسفل تاشديرت، أعلى قرية في شمال إفريقيا. فترة بعد الظهر حرة للراحة أو لزيارة القرية. في اليوم الثالث تنطلقون في الساعة 3:30 صباحا بمصابيح الرأس، وتعبرون تيزي ن تاشديرت (3650 م) وتصلون إلى قمة إنغمر (3891 م) حوالي الثامنة، مع إطلالة على جبال توبقال كلها. العودة إلى المأوى للغداء ثم الطريق إلى مراكش.
