goodToKnow:
  - en: The summit day starts at 2 am and lasts about 9–10 hours of walking. Good fitness is needed.
    fr: La journée du sommet commence à 2 h et compte environ 9 à 10 h de marche. Une bonne condition physique est nécessaire.
    es: El día de cumbre empieza a las 2 de la madrugada y son unas 9–10 horas de marcha. Se necesita buena forma física.
    de: Der Gipfeltag beginnt um 2 Uhr und umfasst etwa 9–10 Stunden Gehzeit. Gute Kondition ist nötig.
    pt: O dia do cume começa às 2 da manhã e são cerca de 9–10 horas de caminhada. É precisa boa forma física.
    ar: يبدأ يوم القمة في الساعة الثانية صباحا ويتطلب حوالي 9 إلى 10 ساعات من المشي. تلزم لياقة بدنية جيدة.
  - en: Weather decides. If the guide judges the summit unsafe, you turn back. Your safety comes first.
    fr: La météo décide. Si le guide juge le sommet dangereux, on fait demi-tour. Votre sécurité passe avant tout.
    es: Manda el tiempo. Si el guía considera que la cumbre no es segura, se da la vuelta. Su seguridad es lo primero.
    de: Das Wetter entscheidet. Hält der Guide den Gipfel für unsicher, kehren Sie um. Ihre Sicherheit geht vor.
    pt: Quem decide é o tempo. Se o guia considerar o cume inseguro, volta-se para trás. A sua segurança está em primeiro lugar.
    ar: الطقس هو الذي يقرر. إذا رأى المرشد أن القمة غير آمنة، نعود أدراجنا. سلامتكم أولا.
