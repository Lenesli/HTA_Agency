    text:
      en: A very early start by head torch over Tizi n’Tacheddirt (3,650 m) to the summit of Inghmer (3,891 m) at an average pace. Walk down to Tacheddirt for lunch, then drive back to Marrakech.
      fr: Départ très matinal à la frontale par Tizi n’Tacheddirt (3 650 m) jusqu’au sommet de l’Inghmer (3 891 m), à rythme moyen. Descente à Tacheddirt pour le déjeuner, puis route vers Marrakech.
      es: Salida muy temprano con linterna frontal por Tizi n’Tacheddirt (3650 m) hasta la cumbre del Inghmer (3891 m), a ritmo medio. Bajada a Tacheddirt para almorzar y regreso a Marrakech.
      de: Sehr früher Aufbruch mit Stirnlampe über den Tizi n’Tacheddirt (3.650 m) zum Gipfel des Inghmer (3.891 m) in mittlerem Tempo. Abstieg nach Tacheddirt zum Mittagessen, dann Rückfahrt nach Marrakesch.
      pt: Partida muito cedo com lanterna frontal por Tizi n’Tacheddirt (3650 m) até ao cume do Inghmer (3891 m), a ritmo médio. Descida a Tacheddirt para almoçar e regresso a Marraquexe.
      ar: انطلاق مبكر جدا بمصابيح الرأس عبر تيزي ن تاشديرت (3650 م) إلى قمة إنغمر (3891 م) بوتيرة متوسطة. النزول إلى تاشديرت للغداء، ثم العودة إلى مراكش.
