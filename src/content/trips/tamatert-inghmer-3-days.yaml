    text:
      en: A walk over the Tamatert pass towards Tacheddirt, with a stop at the Khadija waterfall and its wide view. Lunch at the Ogoug gîte, then a free afternoon to rest before the long summit day (optional walk around the village).
      fr: Marche par le col de Tamatert vers Tacheddirt, avec un arrêt à la cascade Khadija et sa vue panoramique. Déjeuner au gîte d’Ogoug, puis après-midi libre pour se reposer avant la longue journée du sommet (tour du village en option).
      es: Caminata por el collado de Tamatert hacia Tacheddirt, con parada en la cascada Khadija y su vista panorámica. Almuerzo en el albergue de Ogoug y tarde libre para descansar antes del largo día de cumbre (paseo por el pueblo opcional).
      de: Wanderung über den Tamatert-Pass nach Tacheddirt mit Halt am Khadija-Wasserfall und seiner weiten Aussicht. Mittagessen in der Herberge Ogoug, dann freier Nachmittag zur Erholung vor dem langen Gipfeltag (Dorfrundgang optional).
      pt: Caminhada pelo colo de Tamatert até Tacheddirt, com paragem na cascata Khadija e a sua vista panorâmica. Almoço no gîte de Ogoug e tarde livre para descansar antes do longo dia de cume (passeio pela aldeia opcional).
      ar: مشي عبر ممر تامترت نحو تاشديرت، مع توقف عند شلال خديجة وإطلالته البانورامية. الغداء في مأوى أوغوغ، ثم فترة حرة للراحة قبل يوم القمة الطويل (جولة في القرية اختيارية).
