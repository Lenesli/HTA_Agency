summary:
  en: A day out from Marrakech with a two-hour walk, lunch at a panoramic bivouac and a paragliding flight at Agergour, back in the city by 5 pm.
  fr: Une journée au départ de Marrakech avec deux heures de randonnée, un déjeuner dans un bivouac avec vue et un vol en parapente à Agergour, retour en ville à 17 h.
  es: Un día desde Marrakech con dos horas de caminata, almuerzo en un vivac con vistas y un vuelo en parapente en Agergour, de vuelta en la ciudad a las 17 h.
  de: Ein Tag ab Marrakesch mit zwei Stunden Wanderung, Mittagessen in einem Biwak mit Aussicht und einem Paragliding-Flug in Agergour, um 17 Uhr zurück in der Stadt.
  pt: Um dia a partir de Marraquexe com duas horas de caminhada, almoço num bivaque com vista e um voo de parapente em Agergour, de volta à cidade às 17h.
  ar: يوم انطلاقا من مراكش مع ساعتين من المشي، وغداء في مخيم بإطلالة بانورامية، وطيران شراعي في أكركور، والعودة إلى المدينة على الساعة الخامسة مساء.
about:
  en: >-
    An easy way to see the Atlas foothills from above. You leave Marrakech in the morning and have breakfast at Zaouit Bouhita, then walk for about two hours to Azro. Lunch is served at a bivouac with a wide view, before a short drive to Agergour, the paragliding site above the plain south of Marrakech. In the afternoon you fly, then drive back to Marrakech, arriving around 5 pm.
  fr: >-
    Une façon simple de voir les contreforts de l’Atlas d’en haut. Départ de Marrakech le matin et petit-déjeuner à Zaouit Bouhita, puis environ deux heures de marche jusqu’à Azro. Le déjeuner est servi dans un bivouac avec vue panoramique, avant une courte route vers Agergour, le site de parapente au-dessus de la plaine au sud de Marrakech. L’après-midi, c’est l’heure du vol, puis retour à Marrakech vers 17 h.
  es: "Una forma sencilla de ver las estribaciones del Atlas desde el aire. Se sale de Marrakech por la mañana y se desayuna en Zaouit Bouhita; después, unas dos horas de caminata hasta Azro. El almuerzo se sirve en un vivac con vistas panorámicas, antes de una corta carretera hasta Agergour, el sitio de parapente sobre la llanura al sur de Marrakech. Por la tarde llega el vuelo y luego el regreso a Marrakech hacia las 17 h."
  de: "Eine einfache Art, die Ausläufer des Atlas von oben zu sehen. Morgens Abfahrt in Marrakesch und Frühstück in Zaouit Bouhita, dann etwa zwei Stunden Wanderung nach Azro. Das Mittagessen gibt es in einem Biwak mit Panoramablick, danach eine kurze Fahrt nach Agergour, dem Paragliding-Startplatz über der Ebene südlich von Marrakesch. Am Nachmittag fliegen Sie, dann geht es zurück nach Marrakesch, Ankunft gegen 17 Uhr."
  pt: "Uma forma simples de ver os contrafortes do Atlas lá de cima. Parte-se de Marraquexe de manhã e toma-se o pequeno-almoço em Zaouit Bouhita; depois, cerca de duas horas de caminhada até Azro. O almoço é servido num bivaque com vista panorâmica, antes de uma curta viagem até Agergour, o local de parapente sobre a planície a sul de Marraquexe. À tarde é a hora do voo e depois o regresso a Marraquexe, por volta das 17h."
  ar: >-
    طريقة بسيطة لرؤية سفوح الأطلس من الأعلى. الانطلاق من مراكش صباحا وتناول الفطور في زاوية بوهيتة، ثم حوالي ساعتين من المشي إلى أزرو. يُقدَّم الغداء في مخيم بإطلالة بانورامية، قبل طريق قصيرة إلى أكركور، موقع الطيران الشراعي فوق السهل جنوب مراكش. بعد الظهر يحين وقت الطيران، ثم العودة إلى مراكش حوالي الساعة الخامسة مساء.
