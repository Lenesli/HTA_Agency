goodToKnow:
  - en: The flight depends on the wind. If conditions are not safe, the instructor moves or cancels the flight. Your safety comes first.
    fr: Le vol dépend du vent. Si les conditions ne sont pas sûres, le moniteur décale ou annule le vol. Votre sécurité passe avant tout.
    es: El vuelo depende del viento. Si las condiciones no son seguras, el instructor lo aplaza o lo cancela. Su seguridad es lo primero.
    de: Der Flug hängt vom Wind ab. Sind die Bedingungen nicht sicher, verschiebt oder streicht der Fluglehrer den Flug. Ihre Sicherheit geht vor.
    pt: O voo depende do vento. Se as condições não forem seguras, o instrutor adia ou cancela o voo. A sua segurança está em primeiro lugar.
    ar: يعتمد الطيران على الرياح. إذا لم تكن الظروف آمنة، يؤجل المدرب الطيران أو يلغيه. سلامتكم أولا.
  - en: No experience needed. Wear comfortable shoes and bring a warm layer, it can be windy at the take-off point.
    fr: "Aucune expérience nécessaire. Portez des chaussures confortables et prévoyez une couche chaude : il peut y avoir du vent au décollage."
    es: "No hace falta experiencia. Lleve calzado cómodo y una capa de abrigo: en el despegue puede hacer viento."
    de: Keine Erfahrung nötig. Tragen Sie bequeme Schuhe und nehmen Sie eine warme Schicht mit, am Startplatz kann es windig sein.
    pt: "Não é precisa experiência. Use calçado confortável e leve uma camada quente: no local de descolagem pode haver vento."
    ar: لا تحتاجون إلى خبرة. ارتدوا حذاء مريحا وأحضروا ملابس دافئة، فقد تكون هناك رياح عند نقطة الإقلاع.
