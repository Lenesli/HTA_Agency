    text:
      en: Start walking at 11 am up the Mizane valley, past the checkpoint, with lunch at Sidi Chamharouch. In the afternoon you climb on to the Toubkal refuge at an average pace, for dinner and the night.
      fr: Départ à pied à 11 h par la vallée de la Mizane, passage au poste de surveillance et déjeuner à Sidi Chamharouch. L’après-midi, montée jusqu’au refuge du Toubkal à rythme moyen, pour le dîner et la nuit.
      es: Salida a pie a las 11 por el valle del Mizane, paso por el puesto de control y almuerzo en Sidi Chamharouch. Por la tarde, subida al refugio del Toubkal a ritmo medio, para cenar y dormir.
      de: Um 11 Uhr Start der Wanderung durch das Mizane-Tal, vorbei am Kontrollposten, mit Mittagessen in Sidi Chamharouch. Am Nachmittag Aufstieg zur Toubkal-Hütte in mittlerem Tempo, zu Abendessen und Übernachtung.
      pt: Partida a pé às 11h pelo vale do Mizane, passagem pelo posto de controlo e almoço em Sidi Chamharouch. À tarde, subida até ao refúgio do Toubkal a ritmo médio, para jantar e dormir.
      ar: الانطلاق مشيا على الساعة 11 عبر وادي ميزان، مرورا بنقطة المراقبة، والغداء في سيدي شمهروش. بعد الظهر الصعود إلى ملجأ توبقال بوتيرة متوسطة للعشاء والمبيت.
